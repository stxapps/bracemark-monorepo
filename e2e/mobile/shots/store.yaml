# The three in-app mobile store captures, on a phone or — under
# `E2E_WIDTH=wide`, from `--tablet` — on a tablet. `shot/mobile.ts` supplies the
# durable shot-account credentials, the run-local screenshot names, `FRESH` and
# `E2E_WIDTH`. The runner copies those captures into stable artifacts after
# Maestro exits. The fourth capture is the platform share surface in share.yaml.
appId: com.bracemark.app
---
# Warm restart by default, wiped cold start under `--fresh` — subflows/start.yaml
# carries both and the reasoning for preferring the first here.
- runFlow:
    file: subflows/start.yaml

# A tablet capture is landscape and in the synced list layout (subflows/tablet.yaml). The
# branch is the runner's E2E_WIDTH, never what is visible — docs/e2e.md,
# _narrow and wide_. Unset, as in a hand-run `maestro test`, it reads as narrow.
- runFlow:
    when:
      true: ${E2E_WIDTH === 'wide'}
    file: subflows/tablet.yaml

# Select the real My List through the drawer so a warm run cannot inherit an old
# view. Its seven links are the visible fold of the listing-safe library, enough
# to fill the frame while the other links keep the named lists populated.
#
# BY ID, NOT BY NAME, and the id is why this step is two lines instead of a
# platform branch. `tapOn: 'My List'` matched TWO nodes on Android: the drawer is
# an overlay, so the links topbar stays in the view hierarchy BEHIND it, and that
# topbar's title is the current selection's name — the very list this step
# selects. Maestro takes the first match in tree order, the topbar's, whose
# bounds sit under the drawer panel (measured: title [136,167][838,241], drawer
# 0–933 wide), so the touch landed on the drawer, nothing navigated, and the
# drawer stayed open. It reads as an Android drawer quirk and is not one — a
# finger on that row closes it, and `index: 1` on the same text closes it here.
# Neither is the fix: the ambiguity only exists when the title already names this
# list, so an index would be wrong in every other starting state, and the label is
# renameable user data besides. docs/app-drivers.md, _a text match can resolve to
# a node under the drawer_.
#
# What it cost while it was wrong: the drawer stayed up, the row assertions below
# still passed behind it, and every later capture photographed navigation instead
# of the requested scene.
#
# On a tablet the rail is docked and there is no drawer button to press; the
# subflow presses it on a phone and nothing on a tablet.
- runFlow:
    file: ../flows/subflows/open-links-navigation.yaml
- tapOn:
    id: 'links-nav-list-my-list'
- extendedWaitUntil:
    visible: '.*wikihow.com.*'
    timeout: 120000
# The host line arriving is NOT the row being finished. Favicons never sync
# (docs/link-extraction.md, _favicons_), so the device fetches one per host the
# moment these rows mount — six hosts for the whole library, behind the account's
# `deviceExtractionMode: 'all'` (shot/library.ts). The wait above returns on
# the first host STRING, which is several hundred ms before the icons beside them.
# Web's capture counts the `<img>`s and waits for the count to hold
# (shot/scenes.ts, `faviconsQuiesced`); Maestro has nothing addressable to
# count, so settle on the screen itself — this returns as soon as the pixels stop
# moving, which is the last icon landing, and returns immediately once they have.
# Nothing here FAILS if an icon never comes: standardebooks.org serves none, so
# row 3 is a plate by design and a timeout would be the normal case.
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${ONLY_YOU_SHOT}

# Search is committed and the keyboard is gone. The query deliberately matches
# extracted titles from Wikivoyage rather than a URL fragment.
#
# ONE PATH FOR BOTH PLATFORMS: the visible field and its keyboard action, which
# is what a user does. Android went around it for a while, opening the same
# `/links?text=travel` route through the app's scheme; `pressKey: Enter` is
# measured committing the search on this AVD with the bar still up, and the title
# check below is what proves it every run.
#
# What is NOT safe on Android is `hideKeyboard`. Maestro dismisses the IME with
# BACK, and while the bar shows, the topbar registers a `hardwareBackPress`
# handler that closes the search UI and restores the previous view
# (links/topbar.tsx) — so the shutter would catch the view the search ran from,
# green. Enter is enough anyway: `blurAndSubmit` puts the keyboard away as it
# commits.
#
# Enter has its own cost, paid by the next step rather than avoided: a hardware
# key takes Android out of touch mode and the platform paints a focus highlight
# on whatever the blur moves focus to (docs/app-drivers.md, _`pressKey`
# photographs a focus state no user has_).
- tapOn: 'Search links'
- inputText: travel
- pressKey: Enter
# Unanchored: a result can be one accessibility element whose label runs cover,
# host and title together — measured on the iPad, in the card layout — and then
# no node's text STARTS with the title the way a phone's list row does.
- extendedWaitUntil:
    visible: '.*Porto.*'
    timeout: 60000
# A TAP ON THE TITLE changes nothing — it is a `Text`, not a pressable
# (links/topbar.tsx) — and makes the committed state an explicit screen check.
# `Search` is the title only under the global search selection; if a keyboard or
# back action restored My List, this step fails before the shutter.
- tapOn:
    text: 'Search'
    # The tap is meant to change nothing, so spare Maestro the retry it would
    # otherwise spend looking for a change.
    retryTapIfNoChange: false
- takeScreenshot: ${SEARCH_SHOT}

# Re-open the real navigation drawer and return to its top before checking the
# whole composition.
- runFlow:
    when:
      true: ${E2E_WIDTH !== 'wide'}
    commands:
      - tapOn:
          id: 'links-open-navigation'
      - scrollUntilVisible:
          element:
            text: 'Lists'
          direction: UP
          timeout: 30000
          speed: 60

# On a tablet there is no drawer to open: the rail is in every picture, so this
# one has to say something the other three do not. It selects the nested list,
# so the rail shows `Weekends › Lisbon` chosen and the pane shows what is in it.
#
# `leftOf` THE TITLE, because the name is not unique on this screen: the search
# results behind it carry a `lisbon` tag chip, and the rail row is the only
# match whose whole box sits left of the pane. The id can't be used instead —
# a list's id is minted by the import, not named by the library.
- runFlow:
    when:
      true: ${E2E_WIDTH === 'wide'}
    commands:
      - tapOn:
          text: 'Lisbon'
          leftOf:
            id: 'links-title'
      - extendedWaitUntil:
          visible:
            id: 'links-title'
            text: 'Lisbon'
          timeout: 10000
      - extendedWaitUntil:
          visible: '.*Porto.*'
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 10000

- assertVisible: 'Lists'
- assertVisible: 'Lisbon'
- assertVisible: 'Tags'
- takeScreenshot: ${LISTS_AND_TAGS_SHOT}
