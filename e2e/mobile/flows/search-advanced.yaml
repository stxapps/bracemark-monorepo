# Commit an advanced query — one list, one tag, one word — then leave the links
# screen for Settings and come back, and read the same query and the same rows.
#
# What only a device shows: the query is route params held by the links provider
# while another screen is focused, and Settings is a card that dismisses back to
# it (docs/search.md, _on native_ and _leaving the page and coming back_) — a
# provider that re-parsed the focused route's empty params would come back as My
# List.
#
#   maestro test mobile/flows/search-advanced.yaml -e USERNAME=… -e PASSWORD=… \
#     -e LIST_NAME=… -e TAG_NAME=… -e WORD=… -e ALL_URL=… -e NO_WORD_URL=… \
#     -e NO_TAG_URL=… -e NO_LIST_URL=…
#
# The account is on Plus: the structured editor is the `searchEditor` lever.
appId: com.bracemark.app
tags: [SEARCH-002, full, online, destructive, ios, android]
---
- runFlow:
    file: subflows/sign-in.yaml
- runFlow:
    file: subflows/open-settings.yaml
    env:
      SECTION: lists
- runFlow:
    file: subflows/settings-create.yaml
    env:
      NOUN: list
      NAME: ${LIST_NAME}
- runFlow:
    when:
      true: ${E2E_WIDTH !== 'wide'}
    commands:
      - tapOn:
          id: 'settings-open-navigation'
- tapOn:
    id: 'settings-nav-tags'
- runFlow:
    file: subflows/settings-create.yaml
    env:
      NOUN: tag
      NAME: ${TAG_NAME}
- tapOn:
    id: 'settings-close'

# One link meets all three clauses; each of the others misses exactly one.
- runFlow:
    file: subflows/add-link-filed.yaml
    env:
      URL: ${ALL_URL}
      LIST: ${LIST_NAME}
      TAGS: ${TAG_NAME}
- runFlow:
    file: subflows/add-link-filed.yaml
    env:
      URL: ${NO_WORD_URL}
      LIST: ${LIST_NAME}
      TAGS: ${TAG_NAME}
- runFlow:
    file: subflows/add-link-filed.yaml
    env:
      URL: ${NO_TAG_URL}
      LIST: ${LIST_NAME}
      TAGS: ''
- runFlow:
    file: subflows/add-link.yaml
    env:
      URL: ${NO_LIST_URL}
- tapOn:
    id: 'link-options'
- tapOn:
    id: 'link-menu-edit'
- tapOn:
    id: 'edit-link-tags'
- tapOn:
    id: 'tag-picker-search'
- inputText: ${TAG_NAME}
- tapOn:
    text: ${TAG_NAME}
    childOf:
      id: 'tag-picker-rows'
- tapOn:
    id: 'tag-picker-done'
- tapOn:
    id: 'edit-link-save'
- extendedWaitUntil:
    visible:
      id: 'links-screen'
    timeout: 10000

# --- commit -----------------------------------------------------------------------------
# The editor opens on the committed query, and bare My List IS a query, so its
# row starts included; a row cycles include → exclude → off.
#
# The word goes in first, while its field is at the top of the open sheet (it
# can never be scrolled to the middle, and scrolled back to "visible" it sat
# under the sheet's header, where a tap focused nothing). The first checklist
# scroll is a drag, which puts the keyboard away (`keyboardDismissMode`); the
# pause after it lets the sheet settle before anything is pressed.
#
# Each checklist row is scrolled to the middle of the sheet before it is
# pressed, and its new state read back. The rows exist in the tree below the
# fold, and "on screen" is not enough: measured on iOS, the Tags row sat at
# y 800–836 under the pinned footer (794–830), counted as visible, and the tap
# went to the footer — reported COMPLETED, toggled nothing, and the query ran
# without its tag. `centerElement` scrolls it clear.
#
# Wide, the keyboard was still up when the rows were pressed — the dialog is
# tall enough that the scrolls need little or no dragging — so the dialog stays
# squeezed above it, and the last row, the tag, sits at the scroller's end where
# centring cannot move it: under the footer. Measured on the iPad (A16): the tag
# row at y 772–808 and the footer at 782–818, the press reported COMPLETED and
# toggled nothing; with the keys down the row sits at 907–943, clear. So a wide
# run puts the keyboard away itself once the word is in.
- tapOn:
    id: 'links-search-toggle'
- tapOn:
    id: 'links-search-advanced'
- tapOn:
    id: 'advanced-search-text-all'
- inputText: ${WORD}
- assertVisible:
    id: 'advanced-search-text-all'
    text: ${WORD}
- scrollUntilVisible:
    element: 'My List: included'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
# Wide: a tap on the Lists checklist's caption, which is plain text. The sheet's
# scroller is `keyboardShouldPersistTaps="handled"` (components/ui/sheet.tsx),
# so a tap nothing handles puts the keyboard away. Not `hideKeyboard` (on the
# iPad Maestro reports it "Couldn't hide the keyboard") and not a drag (the
# scroller's `keyboardDismissMode` is `interactive`, which an upward drag never
# trips and Android ignores). `below` the Note field, because the match is
# case-insensitive and the rail's LISTS heading is the other "Lists".
- runFlow:
    when:
      true: ${E2E_WIDTH === 'wide'}
    commands:
      - tapOn:
          text: 'Lists'
          below:
            id: 'advanced-search-note'
      - waitForAnimationToEnd:
          timeout: 5000
      - scrollUntilVisible:
          element: 'My List: included'
          direction: DOWN
          centerElement: true
- tapOn: 'My List: included'
- tapOn: 'My List: excluded'
- assertVisible: 'My List: not selected'
- scrollUntilVisible:
    element: '${LIST_NAME}: not selected'
    direction: DOWN
    centerElement: true
- tapOn: '${LIST_NAME}: not selected'
- assertVisible: '${LIST_NAME}: included'
- scrollUntilVisible:
    element: '${TAG_NAME}: not selected'
    direction: DOWN
    centerElement: true
- tapOn: '${TAG_NAME}: not selected'
- assertVisible: '${TAG_NAME}: included'
# Back up to the word field: the checklists sit below the fold of a sheet the
# keyboard has shortened (the sheet keeps the keyboard while it scrolls —
# docs/soft-keyboard.md, _the in-app sheet_), so the field it asserts on has
# scrolled out of view. What is asserted is the draft, not the scroll.
- scrollUntilVisible:
    element:
      id: 'advanced-search-text-all'
    direction: UP
    centerElement: true
- assertVisible:
    id: 'advanced-search-text-all'
    text: ${WORD}
- tapOn:
    id: 'advanced-search-submit'

- runFlow:
    file: parts/search-advanced-results.yaml
- takeScreenshot: advanced-search-committed

# --- leave for Settings, dismiss back -----------------------------------------------------
- runFlow:
    file: subflows/open-settings.yaml
    env:
      SECTION: lists
- tapOn:
    id: 'settings-close'
- runFlow:
    file: parts/search-advanced-results.yaml

# --- the editor reopens on the restored query -------------------------------------------------
- tapOn:
    id: 'links-search-advanced'
- assertVisible:
    id: 'advanced-search-text-all'
    text: ${WORD}
- scrollUntilVisible:
    element: '${TAG_NAME}: included'
    direction: DOWN
    centerElement: true
- assertVisible: '${LIST_NAME}: included'
- takeScreenshot: advanced-search-restored
- tapOn:
    id: 'advanced-search-close'
