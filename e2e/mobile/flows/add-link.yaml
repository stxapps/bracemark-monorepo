# Add two links from the FAB and see both in the already-mounted list.
#
#   maestro test mobile/flows/add-link.yaml -e USERNAME=… -e PASSWORD=… \
#     -e LINK_URL=https://e2e-local.invalid/first-on-device \
#     -e LINK_URL_2=https://e2e-local.invalid/second-on-device
#
# LINK_URL should be unresolvable (`.invalid`), for the same reason the web specs
# use one: bracemark-extractor's SSRF guard blocks every local address with no
# allowlist, so a link that resolves would acquire an extracted title from the
# live internet and make the assertion below non-deterministic. Assert on what was
# typed, never on what was extracted — docs/e2e.md, "what e2e may not assert".
appId: com.bracemark.app
env:
  LINK_URL: 'https://e2e-default.invalid/first-on-device'
  LINK_URL_2: 'https://e2e-default.invalid/second-on-device'
---
- runFlow:
    file: subflows/sign-in.yaml

- tapOn: 'Add link'
- tapOn:
    id: 'add-link-url'
- inputText: ${LINK_URL}
# NO `hideKeyboard` between the URL and Save, and it is not an omission. On iOS
# the command puts the keyboard away by TAPPING A BLANK AREA, and on this screen
# the blank area is the add panel's backdrop — which closes it (a bare typed URL
# is deliberately not "dirty", so the close guard lets that one through, and the
# flow then fails on a Save button that is no longer there). The step is not
# needed either: the panel parks itself on top of the keyboard, so Save is on
# screen the whole time. → docs/soft-keyboard.md, _the add panel_.
- tapOn:
    id: 'add-link-save'

# Untitled links fall back to the URL with the scheme stripped, so the host+path
# is what renders in the row.
# A link row's accessible name is a COMPOSITE — "E, <url>, <host>, now, Link
# options" — and Maestro matches text as a regex against the WHOLE name, so the
# bare url matches nothing. Unanchored, the assertion times out against a link
# that is on screen the entire time, which reads as a sync that never landed or a
# blob that would not decrypt; it cost two full contract runs to tell those
# apart. The `.*` are what make it a substring match. (The urls here are
# `unresolvableUrl()`s — host and path only, no regex metacharacters beyond `.`,
# which is why they can go in raw.)
- extendedWaitUntil:
    visible: ".*${LINK_URL.replace('https://', '')}.*"
    timeout: 20000

# The first insert mounts FlashList from the empty state; the second exercises
# an update of that already-mounted, newest-first list. Keep this assertion
# relaunch-free: persistence alone is not enough — the mounted read must react
# immediately. Maestro's accessibility visibility is not a precise scroll-offset
# assertion, so the list's at-top position contract is verified on the native
# viewport rather than inferred from this selector.
- tapOn: 'Add link'
- tapOn:
    id: 'add-link-url'
- inputText: ${LINK_URL_2}
- tapOn:
    id: 'add-link-save'
- extendedWaitUntil:
    visible: ".*${LINK_URL_2.replace('https://', '')}.*"
    timeout: 20000
- assertVisible: ".*${LINK_URL.replace('https://', '')}.*"
