# Save the sheet share-pick.yaml filled in, and wait for it to dismiss itself.
#
# The two row assertions are not a repeat of that part's: they are the oracle
# for whatever the runner did in between. On Android a configuration change the
# ShareActivity does not declare (bracemark-share's AndroidManifest,
# `configChanges`) destroys the activity and remounts the share root from the
# intent — the sheet is still there, still titled, and back on the default list
# with no tags. Save would then succeed, into the wrong list, and the failure
# would surface a part later as a link that never appears under ${LIST_NAME},
# which names nothing. On iOS nothing happens between the parts and these
# simply pass.
appId: com.bracemark.app
---
- assertVisible:
    id: 'share-list-row'
    text: 'List: ${LIST_NAME}'
- assertVisible:
    id: 'share-tags-row'
    text: 'Tags: ${TAG_NAME}'

- tapOn:
    id: 'share-add'
- extendedWaitUntil:
    visible:
      id: 'share-saved'
    timeout: 30000
- takeScreenshot: shared-with-list-and-tag
- extendedWaitUntil:
    notVisible:
      id: 'share-saved'
    timeout: 10000
