# VIEWPORT-KEYBOARD-001: the tap on the panel's chrome put the keyboard away and
# nothing else — the panel is still open and the draft still in it. Then leave
# by the explicit discard, and bring up the links search box.
appId: com.bracemark.app
---
- assertVisible:
    id: 'add-link-note'
- assertVisible:
    id: 'add-link-url'
    text: ".*${LINK_URL.replace('https://', '')}.*"
- takeScreenshot: keyboard-add-dismissed
- tapOn:
    id: 'add-link-cancel'
- extendedWaitUntil:
    notVisible:
      id: 'add-link-url'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000

# --- the links search box: focused on arrival -----------------------------------------
- tapOn:
    id: 'links-search-toggle'
- extendedWaitUntil:
    visible:
      id: 'links-search-input'
    timeout: 10000
- inputText: ${WORD}
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: keyboard-search
