# Open the Set app lock dialog from Settings → Misc (a Plus account).
appId: com.bracemark.app
---
- runFlow:
    file: ../subflows/open-settings.yaml
    env:
      SECTION: misc
# Not `centerElement`: the button ends the page (lock-app.yaml).
- scrollUntilVisible:
    element:
      id: 'app-lock-set'
    direction: DOWN
- tapOn:
    id: 'app-lock-set'
- extendedWaitUntil:
    visible:
      id: 'lock-dialog-password'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
