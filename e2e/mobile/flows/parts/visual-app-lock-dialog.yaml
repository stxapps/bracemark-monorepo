# Open the Set app lock dialog from Settings → Misc (a Plus account).
appId: com.bracemark.app
---
- runFlow:
    file: ../subflows/open-settings.yaml
    env:
      SECTION: misc
# Not `centerElement`: the button ends the page (lock-app.yaml).
- scrollUntilVisible:
    element:
      id: 'app-lock-set'
    direction: DOWN
# …and on to the end. Where scrollUntilVisible stops is wherever the swipe's
# fling ran out, and the page behind the dialog is in the photograph: on
# Android two runs stopped some 50px apart. The button ends the page, so the end
# is less than a screen away and always the same offset.
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'app-lock-set'
- extendedWaitUntil:
    visible:
      id: 'lock-dialog-password'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
