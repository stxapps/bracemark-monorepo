# VIEWPORT-KEYBOARD-001, the add panel's multiline Note: it cannot dismiss by
# return (it takes newlines), and the panel has to scroll it clear of a keyboard
# that grew a suggestion bar. The runner measures, then taps the panel's chrome.
appId: com.bracemark.app
---
- inputText: ${LINK_URL}
- tapOn:
    id: 'add-link-optional'
- tapOn:
    id: 'add-link-note'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: keyboard-add-note
