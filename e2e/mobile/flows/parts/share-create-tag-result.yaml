# On a wide window the settings rail is docked and has no button to open it
# (subflows/open-settings.yaml), so Tags is one tap away.
appId: com.bracemark.app
---
- runFlow:
    when:
      true: ${E2E_WIDTH !== 'wide'}
    commands:
      - tapOn:
          id: 'settings-open-navigation'
- tapOn:
    id: 'settings-nav-tags'
- extendedWaitUntil:
    visible:
      text: ${TAG_NAME}
      below: 'New tag name'
    timeout: 10000
- takeScreenshot: share-taxonomy-exactly-once
