# Choose a user list, a tag, Show All, Archive and Trash from the drawer — or,
# on a wide window, the docked links rail — and read one member and one
# non-member in each view.
#
# What only a device shows: each drawer pick becomes route params the links
# screen re-reads against expo-sqlite (docs/search.md, _on native_ — a params hook
# that silently parses an empty bag is the specimen), with Trash suppressed from
# Show All and Archive kept in it (use-links.ts).
#
#   maestro test mobile/flows/filters.yaml -e USERNAME=… -e PASSWORD=… \
#     -e FILED_URL=… -e INBOX_URL=… -e ARCHIVED_URL=… -e TRASHED_URL=… \
#     -e LIST_NAME=… -e TAG_NAME=…
#
# The links are added in an order that keeps exactly one row on My List whenever
# a row menu is opened, so `link-options` is never ambiguous.
appId: com.bracemark.app
tags: [FILTER-001, full, online, destructive, ios, android]
---
- runFlow:
    file: subflows/sign-in.yaml

- runFlow:
    file: subflows/add-link.yaml
    env:
      URL: ${ARCHIVED_URL}
- extendedWaitUntil:
    visible: ".*${ARCHIVED_URL.replace('https://', '')}.*"
    timeout: 20000
- tapOn:
    id: 'link-options'
- tapOn:
    id: 'link-menu-archive'
# The menu's portal is `accessibilityViewIsModal`, so while it is up the tree holds
# nothing else and the absence assert below passes against an EMPTY tree — the flow
# then walks on with the menu still open and the next press goes to its backdrop
# (docs/e2e.md, _driving the native apps_). Wait for something the screen always
# shows first, so absence is read against the real screen.
- extendedWaitUntil:
    visible:
      id: 'links-more-options'
    timeout: 10000
- extendedWaitUntil:
    notVisible: ".*${ARCHIVED_URL.replace('https://', '')}.*"
    timeout: 10000
# Put the "links without a preview" prompt away before the next add: every
# `.invalid` link lacks a preview, so it is up from here on (bulk-actions.yaml
# does the same, for the same reason).
- tapOn:
    text: 'Dismiss'
    optional: true

- runFlow:
    file: subflows/add-link.yaml
    env:
      URL: ${TRASHED_URL}
- extendedWaitUntil:
    visible: ".*${TRASHED_URL.replace('https://', '')}.*"
    timeout: 20000
- tapOn:
    id: 'link-options'
- tapOn:
    id: 'link-menu-remove'
- extendedWaitUntil:
    visible:
      id: 'links-more-options'
    timeout: 10000
- extendedWaitUntil:
    notVisible: ".*${TRASHED_URL.replace('https://', '')}.*"
    timeout: 10000

- runFlow:
    file: subflows/add-link.yaml
    env:
      URL: ${INBOX_URL}
- extendedWaitUntil:
    visible: ".*${INBOX_URL.replace('https://', '')}.*"
    timeout: 20000

# Filed into a new list and a new tag, minted by the pickers.
- runFlow:
    file: subflows/dismiss-logbox.yaml
- tapOn: 'Add link'
- runFlow:
    file: subflows/type-autofocused.yaml
    env:
      FIELD: add-link-url
      TEXT: ${FILED_URL}
- tapOn:
    id: 'add-link-optional'
- tapOn:
    id: 'add-link-list'
- tapOn:
    id: 'list-picker-search'
- inputText: ${LIST_NAME}
- tapOn:
    id: 'list-picker-create'
- tapOn:
    id: 'add-link-tags'
- tapOn:
    id: 'tag-picker-search'
- inputText: ${TAG_NAME}
- tapOn:
    id: 'tag-picker-create'
- tapOn:
    id: 'tag-picker-done'
- tapOn:
    id: 'add-link-save'
- extendedWaitUntil:
    notVisible:
      id: 'add-link-url'
    timeout: 10000

# --- the user list ------------------------------------------------------------------
- runFlow:
    file: subflows/open-links-navigation.yaml
- tapOn:
    id: 'links-nav-list-.*'
    text: ${LIST_NAME}
- extendedWaitUntil:
    visible: ".*${FILED_URL.replace('https://', '')}.*"
    timeout: 20000
- assertNotVisible: ".*${INBOX_URL.replace('https://', '')}.*"

# --- the tag ------------------------------------------------------------------------
- runFlow:
    file: subflows/open-links-navigation.yaml
- tapOn:
    id: 'links-nav-tag-.*'
    text: ${TAG_NAME}
- extendedWaitUntil:
    visible: ".*${FILED_URL.replace('https://', '')}.*"
    timeout: 20000
- assertNotVisible: ".*${INBOX_URL.replace('https://', '')}.*"

# --- Show All: Archive is in it, Trash is not --------------------------------------
- runFlow:
    file: subflows/open-links-navigation.yaml
- tapOn:
    id: 'links-nav-all'
- extendedWaitUntil:
    visible: ".*${ARCHIVED_URL.replace('https://', '')}.*"
    timeout: 20000
- assertVisible: ".*${INBOX_URL.replace('https://', '')}.*"
- assertNotVisible: ".*${TRASHED_URL.replace('https://', '')}.*"

# --- Archive ------------------------------------------------------------------------
- runFlow:
    file: subflows/open-links-navigation.yaml
- tapOn:
    id: 'links-nav-list-archive'
- extendedWaitUntil:
    visible: ".*${ARCHIVED_URL.replace('https://', '')}.*"
    timeout: 20000
- assertNotVisible: ".*${INBOX_URL.replace('https://', '')}.*"

# --- Trash --------------------------------------------------------------------------
- runFlow:
    file: subflows/open-links-navigation.yaml
- tapOn:
    id: 'links-nav-list-trash'
- extendedWaitUntil:
    visible: ".*${TRASHED_URL.replace('https://', '')}.*"
    timeout: 20000
- assertNotVisible: ".*${ARCHIVED_URL.replace('https://', '')}.*"
- takeScreenshot: trash-view
