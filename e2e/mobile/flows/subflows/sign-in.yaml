# Sign in an existing account, from a cold start. Pulled in with `runFlow` by
# every flow that needs a session; never run directly.
#
# Parameters (set by the caller's `env:`, or by `maestro test -e`):
#   USERNAME, PASSWORD
#
# The wiped cold start is not optional. `launchApp` RESUMES an app rather than
# cold-starting it (docs/app-drivers.md, "verified against Xcode 26"), so a flow that
# assumes it begins at the landing screen passes alone and fails in a directory
# run, because the previous flow left the app deep in a navigation stack. That
# failure looks exactly like the batch-mode driver bug and is not one. It goes
# through cold-launch.yaml rather than `launchApp: clearState: true` because
# clearing state also clears expo-dev-client's — see that file.
appId: com.bracemark.app
---
- runFlow:
    file: cold-launch.yaml

# The deep link returns before the bundle does, and a cold Metro can take tens of
# seconds to serve it — so wait for the landing screen rather than tapping into
# whatever is on screen.
- extendedWaitUntil:
    visible: 'Sign in'
    timeout: 60000
- tapOn: 'Sign in'

- tapOn:
    id: 'sign-in-username'
- inputText: ${USERNAME}

- tapOn:
    id: 'sign-in-password'
- inputText: ${PASSWORD}

- hideKeyboard
- tapOn:
    id: 'sign-in-submit'

# Argon2id (64 MiB, t=3) runs here on the device — slower than the browser, and
# much slower on a cold simulator. This is the one place in the mobile flows that
# genuinely needs a long wait.
#
# It is a poll rather than one `extendedWaitUntil` because of iOS AutoFill. On a
# successful sign-in iOS offers to save the credentials in a SpringBoard sheet —
# a window the app does not own, drawn OVER it, so while it is up the hierarchy
# holds "Save Password?" and nothing else. Whether it lands before or after the
# links screen paints is a race against Argon2 finishing (both orders observed on
# consecutive runs of the same flow), and it does not go away on its own:
#
#   - lands FIRST  → a plain `extendedWaitUntil` for links-screen sits behind the
#                    sheet until it times out.
#   - lands SECOND → this subflow passes and the CALLER's first assertion fails,
#                    against a link that is on screen the whole time. That is how
#                    it presented on the first real contract run, and it reads
#                    exactly like a sync that never arrived.
#
# So: dismiss, wait a beat, re-check — the optional `assertVisible` is what paces
# the loop (it waits out its own lookup timeout before warning), and the optional
# `tapOn` is a no-op on the passes where no sheet is up. The hard assert after the
# loop is what actually fails the flow if the links screen never arrives, so a
# broken sign-in still fails as a broken sign-in.
#
# Nothing in the app can suppress the sheet without also opting out of real
# password managers, and the platform guard keeps Android — which never shows it —
# from paying for the lookups.
- repeat:
    times: 5
    while:
      notVisible:
        id: 'links-screen'
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: 'Not Now'
                optional: true
      - assertVisible:
          id: 'links-screen'
          optional: true

- assertVisible:
    id: 'links-screen'

# The second half of the race: the sheet can still be on its way in when the
# links screen is already up. This waits it out once — WARNED, not failed, when
# it never comes — so the caller is handed a screen nothing is covering.
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          text: 'Save Password?'
          optional: true
      - tapOn:
          text: 'Not Now'
          optional: true
