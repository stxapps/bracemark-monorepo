# Cross Safari's system share sheet on iOS, then prove which process opened by
# waiting on an element rendered only by Bracemark's share tree. Android arrives
# with ShareActivity already started by runner/share.ts, so it needs only the
# far-side assertion.
#
# Parameters: SHARE_SOURCE_TEXT (iOS caller's settled text), SHARE_STATE_ID.
appId: com.bracemark.app
---
- runFlow:
    when:
      platform: iOS
    commands:
      # The page, or the coachmark Safari 26 shows once over the bottom menu —
      # whichever comes first. The coachmark is modal: while it is up neither the
      # page nor the address bar is in the tree, so a wait on the page alone runs
      # out under it. The api's health document paints before it and never met
      # that; a page that costs a network round trip (the SHARE-EXTRACT cases'
      # example.com) is beaten by it every time on a simulator that has not
      # dismissed it yet.
      - extendedWaitUntil:
          visible: '(${SHARE_SOURCE_TEXT})|Close'
          timeout: 30000
      - assertVisible:
          text: 'Close'
          optional: true
      - tapOn:
          text: 'Close'
          optional: true
      - extendedWaitUntil:
          visible: ${SHARE_SOURCE_TEXT}
          timeout: 30000

      - tapOn: 'More'
      - extendedWaitUntil:
          visible: 'Share'
          timeout: 30000
      - tapOn: 'Share'
      - extendedWaitUntil:
          visible: 'Bracemark'
          timeout: 30000

      # Maestro's semantic tap reports COMPLETED but silently dismisses back to
      # Safari. The measured activity-row coordinate launches the extension;
      # percentages retain the target on the larger supported phone profile.
      - tapOn:
          point: '61%,74%'

- extendedWaitUntil:
    visible:
      id: ${SHARE_STATE_ID}
    timeout: 60000
