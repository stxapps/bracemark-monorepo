# Cold-start the app with a wiped state, straight into the JS bundle. Pulled in
# with `runFlow` by every flow that used to say `launchApp: clearState: true`;
# never run directly.
#
# `clearState` is `pm clear` (and its iOS equivalent), so it wipes the app's WHOLE
# data dir — including the two SharedPreferences files expo-dev-client keeps:
#
#   expo.modules.devlauncher.recentyopenedapps   → which bundle to load
#   expo.modules.devmenu.sharedpreferences       → isOnboardingFinished
#
# Cleared, the dev build has nothing to open, so a plain `launchApp` lands on the
# dev-launcher home screen ("enter the dev server URL") instead of the app, and
# then — because onboarding also reads as unfinished — the dev-menu sheet slides
# up over whatever loaded. Neither belongs to bracemark and neither is assertable;
# a flow that ignores them times out on its first `tapOn`.
#
# The deep link answers both. `expo-development-client` is the dev launcher's own
# host: given `url`, it skips the home screen and loads that bundle directly, and
# `disableOnboarding=1` sets `isOnboardingFinished` (persisted, so it also covers
# the plain `launchApp`s later in a flow). The param rides on the INNER url on
# purpose — Android reads it off the parsed manifest URL and iOS off `expoUrl`,
# both of which are the inner one, and keeping it there leaves the outer link free
# of `&`, which `adb shell` would otherwise eat. Metro ignores the extra param.
#
# `localhost:8081` is the same call docs/e2e.md makes for the api and extractor
# ports: the simulator has it for free and `expo:android:reverse` reverses 8081
# for the emulator, so ONE link serves both platforms — Maestro turns `openLink`
# into `xcrun simctl openurl` or an `am start` as needed. That does mean this
# assumes a DEV build with Metro up, which the mobile legs already require
# (e2e/README.md). The hand-driven twins are `npm run expo:ios:open` and
# `expo:android:open`.
#
# The link's default lives IN the expression, not in an `env:` block. A
# subflow's own `env:` beats both `-e` and the caller's `runFlow: env:` (measured
# on Maestro 2.8.0 — docs/e2e.md, _driving the native apps_), so a default there
# made runner/native-run.ts's EXPO_DEV_CLIENT_LINK override a silent no-op while
# run.json recorded it. An unset variable is `undefined` rather than an error, so
# `||` falls back only for a hand-run `maestro test` that passes no link; keep
# the literal in step with DEFAULT_DEV_CLIENT_LINK there.
appId: com.bracemark.app
---
# Release bundles are embedded in the app. This mode comes from the runner,
# whose preflight verifies the installed binary against its Release receipt.
- runFlow:
    when:
      true: ${E2E_BUILD_VARIANT === 'release'}
    commands:
      - launchApp:
          clearState: true
- runFlow:
    when:
      true: ${E2E_BUILD_VARIANT !== 'release'}
    commands:
      - clearState
      - openLink:
          link: "${EXPO_DEV_CLIENT_LINK || 'bracemark://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081%2F%3FdisableOnboarding%3D1'}"
          autoVerify: false

# iOS 26.5 confirms custom-scheme handoff after app state is cleared. Older iOS
# versions and Android open immediately, so keep the system button optional and
# platform-gated. This remains part of cold launch: callers should never need to
# know whether the dev-client link required a confirmation on this simulator.
- runFlow:
    when:
      platform: iOS
      true: ${E2E_BUILD_VARIANT !== 'release'}
    commands:
      # The alert can arrive after the app has already painted behind it. Pace
      # the optional tap with an optional lookup so we do not race that arrival
      # — a BOUNDED one. A bare optional `assertVisible` waits out Maestro's own
      # lookup timeout (~17s) every time the alert does not come, and on the
      # iPhone 17 Pro simulator it never did: 0 of 84 cold launches across the
      # iOS runs of 2026-10-17..26, which made this wait ~13 minutes of a full
      # iPhone run. The alert answers `openurl`, which has already returned by
      # now, so a few seconds is the window it has.
      - extendedWaitUntil:
          visible: 'Open'
          timeout: 3000
          optional: true
      - tapOn:
          text: 'Open'
          optional: true
