# A dirty editor refuses an ACCIDENTAL close and permits an EXPLICIT discard, in
# both native editors — the add panel and the link editor, both bodies in the
# in-app sheet (src/components/ui/sheet.tsx), which routes every accidental
# vector to the body's `onDismiss`.
#
# The accidental vectors are platform ones, which is why this is a device case:
# the backdrop tap on both platforms, Android's hardware back (the sheet's
# BackHandler), and on a phone the swipe-down on the sheet's header. On a wide
# window both bodies are a centred `max-w-lg` dialog with the swipe disabled
# (`Gesture.Pan().enabled(!wide)` in sheet.tsx), so the backdrop beside the
# dialog is the door there, for the editor too (docs/safe-area.md, _wide
# windows on native_). What "dirty" means stays in jest (docs/editors.md,
# _invariant 3_).
#
# Widths: narrow and wide. The branches read the runner's E2E_WIDTH
# (docs/e2e.md, _narrow and wide_).
#
#   maestro test mobile/flows/link-close-guard.yaml -e USERNAME=… -e PASSWORD=… \
#     -e ANCHOR_URL=https://e2e-local.invalid/anchor \
#     -e DISCARDED_URL=https://e2e-local.invalid/discarded -e DRAFT_NOTE=…
#
# No flow-level `env:` defaults: on Maestro 2.8.0 they beat `-e`, so the
# runner's values would be silently replaced (docs/e2e.md, _driving the native
# apps_).
appId: com.bracemark.app
tags: [LINK-CLOSE-001, full, online, ios, android]
---
- runFlow:
    file: subflows/sign-in.yaml

# A saved link: what the editor opens on, and what makes the absence
# assertions after the restart mean something.
- tapOn: 'Add link'
- runFlow:
    file: subflows/type-autofocused.yaml
    env:
      FIELD: add-link-url
      TEXT: ${ANCHOR_URL}
- tapOn:
    id: 'add-link-save'
- extendedWaitUntil:
    visible: ".*${ANCHOR_URL.replace('https://', '')}.*"
    timeout: 20000

# --- the add panel ----------------------------------------------------------------
# A bare typed URL is deliberately NOT dirty; the note makes it so.
- tapOn: 'Add link'
- runFlow:
    file: subflows/type-autofocused.yaml
    env:
      FIELD: add-link-url
      TEXT: ${DISCARDED_URL}
- tapOn:
    id: 'add-link-optional'
# Note can sit below the fold: on a short window with the keyboard up (a tablet
# on its side leaves ~250dp) the sheet caps itself and scrolls its fields. A
# no-op wherever Note is already in view.
- scrollUntilVisible:
    element:
      id: 'add-link-note'
    direction: DOWN
- tapOn:
    id: 'add-link-note'
- inputText: ${DRAFT_NOTE}

# A backdrop tap — the point is the window's shape, and it is tapped twice
# (subflows/tap-sheet-backdrop.yaml says why).
- runFlow:
    file: subflows/tap-sheet-backdrop.yaml
- assertVisible:
    id: 'add-link-note'
    text: ${DRAFT_NOTE}

# Hardware back, twice for the same reason: the first press only closes the IME
# when one is up; the second reaches the panel's BackHandler.
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - back
      - assertVisible:
          id: 'add-link-note'
          text: ${DRAFT_NOTE}
- takeScreenshot: dirty-add-panel-held

# The explicit discard.
- tapOn:
    id: 'add-link-cancel'
- extendedWaitUntil:
    notVisible:
      id: 'add-link-url'
    timeout: 10000

# --- the editor -----------------------------------------------------------------------
- tapOn:
    id: 'link-options'
- tapOn:
    id: 'link-menu-edit'
- tapOn:
    id: 'edit-link-note'
- inputText: ${DRAFT_NOTE}

# iOS on a phone: the sheet's swipe-down, dragged from its header. There the
# editor fills the window to the status bar, whose strip iOS keeps for itself,
# so this — not a backdrop tap — is its accidental door (docs/soft-keyboard.md,
# _the in-app sheet_). The header's title is plain text, so the drag starts on
# nothing pressable.
- runFlow:
    when:
      platform: iOS
      true: ${E2E_WIDTH !== 'wide'}
    commands:
      - swipe:
          start: '50%,12%'
          end: '50%,90%'
          duration: 400
# Wide, both platforms: the editor is a dialog with backdrop around it.
- runFlow:
    when:
      true: ${E2E_WIDTH === 'wide'}
    file: subflows/tap-sheet-backdrop.yaml
# Android: back, twice — the first may only close the IME.
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - back
- assertVisible:
    id: 'edit-link-note'
    text: ${DRAFT_NOTE}
- takeScreenshot: dirty-edit-screen-held

- tapOn:
    id: 'edit-link-cancel'
- extendedWaitUntil:
    visible:
      id: 'links-screen'
    timeout: 10000

# --- nothing was written, as seen after a cold start ----------------------------------
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ".*${ANCHOR_URL.replace('https://', '')}.*"
    timeout: 30000
- assertNotVisible: ".*${DISCARDED_URL.replace('https://', '')}.*"

- tapOn:
    id: 'link-options'
- tapOn:
    id: 'link-menu-edit'
- extendedWaitUntil:
    visible:
      id: 'edit-link-note'
    timeout: 10000
- assertNotVisible:
    id: 'edit-link-note'
    text: '.*${DRAFT_NOTE}.*'
- takeScreenshot: discarded-drafts-after-cold-restart
