# The render leg's layout pick (`npm run measure:render:ios` /
# `measure:render:android`, e2e/measure/render-mobile.ts): Settings → Misc, the
# named link layout, and back to a laid-out links list. Starts and ends on the
# links screen. The pick itself is mobile/flows/parts/visual-layout.yaml's.
#
# Parameters: LAYOUT — the radio's label, `List` or `Card`; E2E_WIDTH — `wide`
# or `narrow`, for open-settings.yaml's branch.
appId: com.bracemark.app
---
- runFlow:
    file: ../../mobile/flows/subflows/open-settings.yaml
    env:
      SECTION: misc
# On iOS the row's name folds its hint in after a comma, hence the optional
# tail; on an iPad it also leads with empty slots (`​, ​, List, A dense…`), hence
# the optional head. The commas keep `List` from matching the `Lists` section.
- tapOn: '(.*, )?${LAYOUT}(, .*)?'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'settings-close'
- extendedWaitUntil:
    visible:
      id: 'links-list'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
