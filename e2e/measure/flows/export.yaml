# One export leg of `npm run measure:data:ios` / `measure:data:android`: from
# the Data overview, export in FORMAT_LABEL's format and stop on the stall
# probe's reading. Runs in the same app session as the restore before it — no
# cold launch — so the library is the one that just synced.
#
# The share sheet this platform presents when a run finishes (data-section.tsx,
# ExportView) is dismissed rather than used: the measured work is the run, and
# the sheet only opens after it.
#
# Parameters: FORMAT_LABEL (the radio's label — 'HTML bookmarks', 'CSV',
# 'Plain text', 'Bracemark backup').
appId: com.bracemark.app
---
- tapOn:
    id: 'export-data-open'
# A prefix match: the radio row folds its label and hint into one accessible
# name ("HTML bookmarks, For web browsers…"), so the label alone is no node.
- tapOn: '${FORMAT_LABEL}.*'
- tapOn:
    id: 'export-data-submit'
# The view presents the sheet once per finished run, and the receipt paints a
# beat BEFORE it — so polling for the receipt and dismissing "a sheet if one is
# up" ends on the bare receipt, and the sheet lands on top afterwards
# (docs/e2e.md, _scale, loading and offline_). So wait for the sheet itself,
# which every run presents, then put it away (dismiss-share-sheet.yaml, which
# carries the run's budget) and read the receipt under it.
- runFlow:
    file: dismiss-share-sheet.yaml
- extendedWaitUntil:
    visible:
      id: 'export-data-complete'
    timeout: 10000

- scrollUntilVisible:
    element:
      id: 'measure-stall-reading'
- extendedWaitUntil:
    visible:
      id: 'measure-stall-reading'
      text: '.*"label":"export".*'
    timeout: 10000
