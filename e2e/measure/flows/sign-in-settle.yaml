# The render leg's device sign-in (e2e/measure/render-mobile.ts): sign in to the
# account the run restored on web, and stop on Settings → Data, whose sync card
# the runner polls until the pull has landed.
#
# Parameters: USERNAME, PASSWORD, EXPO_DEV_CLIENT_LINK, E2E_WIDTH (`wide` or
# `narrow`, for open-settings.yaml's branch).
appId: com.bracemark.app
---
- runFlow:
    file: ../../mobile/flows/subflows/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: 'links-screen'
    timeout: 120000
- runFlow:
    file: ../../mobile/flows/subflows/open-settings.yaml
    env:
      SECTION: data
- extendedWaitUntil:
    visible:
      id: 'export-data-open'
    timeout: 10000
