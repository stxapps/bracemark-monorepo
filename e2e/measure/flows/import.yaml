# One import leg of `npm run measure:data:ios` / `measure:data:android`
# (e2e/measure/data-mobile.ts): sign in, import the one staged file through the
# real document picker, and stop on the stall probe's reading. The runner reads
# that reading off the accessibility tree after this flow exits. The navigation
# and the picker walk are mobile/flows/import-data.yaml's, which carries the
# reasoning for each step.
#
# Parameters: USERNAME, PASSWORD, IMPORT_FILE_STEM (the file name without its
# extension), EXPO_DEV_CLIENT_LINK, E2E_WIDTH (`wide` or `narrow`: on a wide
# window the settings menu is docked with no button to open it). An Android
# tablet runs it; an iPad cannot — its Files picker is a remote view that
# exposes nothing to XCUITest, sidebar and tiles alike (data-mobile.ts refuses
# one up front).
appId: com.bracemark.app
---
- runFlow:
    file: ../../mobile/flows/subflows/sign-in.yaml

- runFlow:
    file: ../../mobile/flows/subflows/open-settings.yaml
    env:
      SECTION: data
- tapOn:
    id: 'import-data-open'
- tapOn:
    id: 'import-data-choose'

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Browse'
      - extendedWaitUntil:
          visible: 'On My iPhone'
          timeout: 20000
      - tapOn: 'On My iPhone'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: 'Show roots'
      - extendedWaitUntil:
          visible:
            text: 'Downloads'
            childOf:
              id: 'com.google.android.documentsui:id/roots_list'
          timeout: 20000
      # Scoped to the drawer, as import-data.yaml is: the picker can reopen
      # Downloads and keep its breadcrumb behind the drawer, and an unscoped match
      # taps Recent there, which never lists the adb-pushed file.
      - tapOn:
          text: 'Downloads'
          childOf:
            id: 'com.google.android.documentsui:id/roots_list'

# The STEM, not the file name: iOS Files hides a known extension, so a staged
# `measure-bookmarks-300.html` is listed as `measure-bookmarks-300`.
- extendedWaitUntil:
    visible: '.*${IMPORT_FILE_STEM}.*'
    timeout: 20000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: '18%, 30%'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: 'com.google.android.documentsui:id/item_root'

# A 50,000-link import is minutes on a device, not seconds.
- extendedWaitUntil:
    visible:
      id: 'import-data-complete'
    timeout: 1800000
- scrollUntilVisible:
    element:
      id: 'measure-stall-reading'
- extendedWaitUntil:
    visible:
      id: 'measure-stall-reading'
      text: '.*"label":"import".*'
    timeout: 10000
