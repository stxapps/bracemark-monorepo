			shellScript = "# The browser extension itself is apps/bracemark-extension's Safari build,\n# copied into build/extension by tools/scripts/macos-app.sh. Safari reads\n# manifest.json from the root of this appex's Resources, and WXT renames its\n# chunks on every build, so the whole folder is copied here rather than\n# listed file by file in this project. docs/browser-extension.md, _Safari_.\nset -eu\nsrc=\"${PROJECT_DIR}/build/extension\"\nif [ ! -f \"${src}/manifest.json\" ]; then\n  echo \"error: no browser extension build in apps/bracemark-macos/build/extension. Run npm run app:staging or npm run bundle from apps/bracemark-macos first.\" >&2\n  exit 1\nfi\ndest=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nmkdir -p \"${dest}\"\nrsync -a --delete \"${src}/\" \"${dest}/\"\n# Declared as this phase's output and touched on every run: that is what makes\n# Xcode re-sign the appex after the copy. Without it an incremental build kept\n# the old signature over new files, and Safari silently refused to load the\n# extension (no toolbar button, no background).\ntouch \"${dest}/manifest.json\"\n";
